<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do2Date — usage</title>
<!-- Deliberately not indexed. Nothing secret is served here without a verified
     owner token, but there is no reason for this page to appear in search. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<style>
  body { max-width: 900px; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-3);
    margin-bottom: var(--space-5);
  }
  .stat {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
  }
  .stat .n {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.1;
    /* Tabular figures so a column of numbers lines up instead of jittering. */
    font-variant-numeric: tabular-nums;
  }
  .stat .k {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .stat .sub { font-size: 0.75rem; color: var(--text-secondary); margin-top: 6px; }
  h2 {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: var(--space-5) 0 var(--space-3);
  }
  .panel {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
  }
  /* Bars are divs, not a charting library. Thirty numbers do not justify
     shipping a dependency, and this stays readable in both themes for free. */
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 74px; margin-top: var(--space-2); }
  .spark div {
    flex: 1;
    background: var(--primary);
    border-radius: 3px 3px 0 0;
    min-height: 2px;
    opacity: .85;
  }
  .spark div.zero { background: var(--border); opacity: 1; }
  .axis { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-secondary); margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-secondary); font-size: 0.9rem; }
  .msg {
    padding: var(--space-4);
    border-radius: var(--radius-md);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    margin-bottom: var(--space-4);
  }
  .msg.bad { background: var(--danger); color: #fff; }
  .foot { margin-top: var(--space-6); font-size: 0.78rem; color: var(--text-secondary); }
</style>
</head>
<body>

<div class="header-container">
  <h1>Usage</h1>
  <div style="display:flex; gap:12px; align-items:center;">
    <button id="refreshBtn" class="btn-secondary" onclick="load()" style="display:none;">Refresh</button>
    <a href="/" class="btn-secondary" style="text-decoration:none; padding:10px 18px; border-radius:var(--radius-md); border:1px solid var(--border); color:var(--text-primary);">Back to app</a>
  </div>
</div>

<div id="signin" class="msg" style="display:none;">
  <p style="margin-bottom:12px;">Sign in with the owner account to see the numbers.</p>
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <input type="email" id="email" placeholder="Email" style="flex:1; min-width:180px;">
    <input type="password" id="password" placeholder="Password" style="flex:1; min-width:180px;">
    <button onclick="signIn()">Sign in</button>
  </div>
  <div id="signinError" style="display:none; margin-top:10px; color:var(--danger); font-size:0.9em;"></div>
</div>

<div id="status" class="msg">Loading…</div>
<div id="out" style="display:none;"></div>

<p class="foot" id="foot"></p>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const app = initializeApp({
  apiKey: "AIzaSyDMUYpjYlhz6oTIleIRFtsIDsa2DJ1JJQQ",
  authDomain: "do2date.firebaseapp.com",
  databaseURL: "https://do2date-default-rtdb.firebaseio.com",
  projectId: "do2date",
  storageBucket: "do2date.firebasestorage.app",
  messagingSenderId: "400907128510",
  appId: "1:400907128510:web:4637204f184d355cd098ef"
});
const auth = getAuth(app);

const $ = (id) => document.getElementById(id);
const setStatus = (text, bad) => {
  const el = $('status');
  el.style.display = 'block';
  el.className = 'msg' + (bad ? ' bad' : '');
  el.textContent = text;
};

window.signIn = async () => {
  $('signinError').style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, $('email').value, $('password').value);
  } catch (error) {
    $('signinError').textContent = 'That did not work. Check the email and password.';
    $('signinError').style.display = 'block';
  }
};

const n = (v) => (v ?? 0).toLocaleString();

function stat(value, label, sub) {
  return `<div class="stat"><div class="n">${n(value)}</div><div class="k">${label}</div>${
    sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}

function spark(series, label) {
  const max = Math.max(1, ...series.map((d) => d.count));
  const bars = series.map((d) =>
    `<div class="${d.count === 0 ? 'zero' : ''}" style="height:${Math.max(2, (d.count / max) * 74)}px" title="${d.date}: ${d.count}"></div>`
  ).join('');
  const total = series.reduce((sum, d) => sum + d.count, 0);
  return `<div class="panel">
      <strong style="color:var(--text-primary)">${label}</strong>
      <span class="muted"> · ${total} in the last 30 days</span>
      <div class="spark">${bars}</div>
      <div class="axis"><span>${series[0]?.date ?? ''}</span><span>${series[series.length-1]?.date ?? ''}</span></div>
    </div>`;
}

window.load = async () => {
  const user = auth.currentUser;
  if (!user) return;
  setStatus('Loading…');
  try {
    const token = await user.getIdToken();
    const res = await fetch('/api/admin/stats', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json().catch(() => null);

    if (!res.ok || !data || !data.ok) {
      // 404 is what a non-owner gets, on purpose — it does not confirm the
      // endpoint exists. Translate it here rather than showing "Not found".
      setStatus(res.status === 404
        ? 'This account is not the owner account.'
        : (data && data.error) || `Couldn't load stats (HTTP ${res.status}).`, true);
      return;
    }

    $('status').style.display = 'none';
    $('refreshBtn').style.display = 'inline-block';

    const tzRows = Object.entries(data.timezones || {}).sort((a, b) => b[1] - a[1]).slice(0, 6);

    $('out').innerHTML = `
      <div class="stat-grid">
        ${stat(data.accounts.total, 'Accounts', `${n(data.accounts.withAtLeastOneClass)} added a class`)}
        ${stat(data.syllabus.totalParses, 'Syllabus reads', `${n(data.syllabus.usersWhoParsed)} students used it`)}
        ${stat(data.installs.total, 'App installs', 'signed-in only')}
        ${stat(data.notifications.total, 'Notifications on', 'signed-in only')}
        ${stat(data.content.classes, 'Classes')}
        ${stat(data.content.assignments, 'Assignments')}
        ${stat(data.content.tests, 'Tests')}
        ${stat(data.content.syllabiAttached, 'Syllabi attached')}
      </div>

      <h2>Over time</h2>
      ${spark(data.syllabus.perDay, 'Syllabus reads')}
      ${spark(data.installs.perDay, 'App installs')}

      <h2>Leaderboards</h2>
      ${(data.leaderboards || []).length === 0
        ? '<div class="panel muted">No scores yet.</div>'
        : data.leaderboards.map((b) => `
          <div class="panel">
            <strong style="color:var(--text-primary)">${b.game}</strong>
            <span class="muted"> · ${n(b.players)} player${b.players === 1 ? '' : 's'}</span>
            ${b.top.length ? `<table style="margin-top:8px">
              <tr><th>Player</th><th class="num">Score</th></tr>
              ${b.top.map((r) => `<tr><td>${r.name}</td><td class="num">${n(r.score)}</td></tr>`).join('')}
            </table>` : ''}
          </div>`).join('')}

      <h2>Where they are</h2>
      <div class="panel">
        ${tzRows.length ? `<table>
          <tr><th>Time zone</th><th class="num">Students</th></tr>
          ${tzRows.map(([zone, count]) => `<tr><td>${zone.replace(/_/g, ' ')}</td><td class="num">${n(count)}</td></tr>`).join('')}
        </table>` : '<span class="muted">No time zones recorded yet.</span>'}
      </div>
    `;
    $('out').style.display = 'block';
    $('foot').textContent =
      'Read live from your own database. Installs and notification counts only cover signed-in users, '
      + 'so they run low rather than high. Visit and visitor counts live in the Vercel dashboard. '
      + 'Generated ' + new Date(data.generatedAt).toLocaleString() + '.';
  } catch (error) {
    setStatus("Couldn't reach the stats endpoint.", true);
  }
};

// Registered LAST, deliberately. Firebase can report a restored session
// immediately, and the callback calls load() — which does not exist yet if this
// sits above the definition. Ordering, not a race: a module body runs top to
// bottom, so anything a callback reaches for has to already be assigned.
onAuthStateChanged(auth, (user) => {
  if (user) {
    $('signin').style.display = 'none';
    window.load();
  } else {
    $('signin').style.display = 'block';
    setStatus('Not signed in.');
    $('out').style.display = 'none';
  }
});
</script>
</body>
</html>
